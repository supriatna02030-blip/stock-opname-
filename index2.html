<style>

<body>

<div class="container">

  <div class="sub-title" id="subTitleToko">K792 / KARBELA2</div>

  <div id="loginBox" class="login-box">
    <h3>🔒 Login Dulu</h3>

    <button onclick="login()">Masuk</button>

  <div id="mainApp">
    <input type="text" id="kodeToko" placeholder="🏪 Kode/Nama Toko. Ex: K792/KARBELA2" value="K792/KARBELA2" onchange="updateKodeToko()">

    <div class="filter-shift">
      <input type="date" id="tanggalOpname">
      <select id="pilihShift">
        <option value="SHIFT 1">SHIFT 1</option>

        <option value="SHIFT 3">SHIFT 3</option>

    </div>
    <input type="text" id="namaPIC" placeholder="👤 Nama PIC Yang SO">
    <input type="text" id="searchBarang" placeholder="🔍 Cari Nama Barang / Kode..." onkeyup="searchBarang()">

    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center">

      <button class="btn-copy" onclick="copyDariShiftSebelumnya()">📋 Copy dari Shift Sebelumnya</button>
      <button class="btn-reset-angka" onclick="resetAngka()">🔄 Reset Angka</button>
      <button class="btn-selesai" onclick="tandaiSelesai()">✅ Tandai Selesai</button>
      <button class="btn-aksi" onclick="simpanOpname()">💾 Simpan Opname</button>
      <button class="btn-aksi" onclick="exportExcel()">📤 Export Excel</button>
    </div>
    <div class="autosave-info" id="autoSaveInfo">💾 Auto Save Aktif</div>

    <h3>📜 Riwayat Opname Per Hari & Shift</h3>
    <div id="listRiwayat"></div>

    <div id="tabelContainer"></div>
    <div id="rekapMinusContainer"></div>
    <div class="total" id="totalStok"></div>
  </div>
</div>

<script>
let dataBarang = [];
let tanggalAktif = "";
let shiftAktif = "SHIFT 1";
let namaPIC = "";
let kodeToko = "K792/KARBELA2";
let isSelesai = false;
const PASSWORD = "";

// AUTO SAVE TIAP 10 DETIK
setInterval(() => {
  if(dataBarang.length > 0) {
    simpanData();

}, 10000);

// LANGSUNG BUKA APLIKASI
window.onload = function(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('tanggalOpname').valueAsDate = new Date();
  tanggalAktif = document.getElementById('tanggalOpname').value;
  document.getElementById('kodeToko').value = kodeToko;
  document.getElementById('subTitleToko').innerText = kodeToko;
  loadData(); tampilkan(); tampilkanDaftarRiwayat();
}

function updateKodeToko(){
  kodeToko = document.getElementById('kodeToko').value;
  document.getElementById('subTitleToko').innerText = kodeToko;
  tampilkan();
}

// TEMPLATE SHIFT - 43 ITEM
const templateShift = [

];

function searchBarang(){ /* sama seperti sebelumnya */ }
function tandaiSelesai(){ /* sama seperti sebelumnya */ }
function loadTemplate(){ /* sama seperti sebelumnya */ }
function copyDariShiftSebelumnya(){ /* sama */ }
function resetAngka(){ /* sama */ }

function tampilkan() {
  if(document.getElementById('searchBarang').value!== "") return searchBarang();
  let container = document.getElementById('tabelContainer');
  container.innerHTML = '';
  let kategoriList = [...new Set(dataBarang.map(x => x.kategori))];
  let totalOH=0; let totalFisik=0; let listMinus = [];

  kategoriList.forEach(kat => {
    let html = `<h3 class="kategori">${kat}</h3><table><tr><th>No</th><th>Kode</th><th>Nama Barang</th><th>OH</th><th>Fisik</th><th>Selisih</th></tr>`;
    let no=1;
    dataBarang.filter(x => x.kategori === kat).forEach((item) => {
      let index = dataBarang.indexOf(item);
      totalOH += Number(item.oh) || 0; totalFisik += Number(item.fisik) || 0;
      let selisih = (Number(item.fisik) || 0) - (Number(item.oh) || 0);
      if(selisih < 0) listMinus.push({...item, selisih: Math.abs(selisih)});
      let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : '';
      let icon = selisih === 0 && item.oh!== ""? '✅' : selisih > 0? `(+${selisih})` : selisih < 0? `(-${Math.abs(selisih)})` : '';
      html += `<tr><td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td>
        <td><input type="number" value="${item.oh}" onchange="updateOH(${index}, this.value)" style="width:70px"></td>
        <td><input type="number" value="${item.fisik}" onchange="updateFisik(${index}, this.value)" style="width:70px"></td>
        <td class="${classSelisih}">${icon}</td></tr>`;
    });
    html += `</table>`; container.innerHTML += html;
  });

  let rekapHtml = `<h4 class="rekap">📉 REKAP BARANG MINUS / HILANG - ${shiftAktif} - ${kodeToko}</h4>`;
  rekapHtml += listMinus.length === 0? `<p>✅ Aman, tidak ada barang minus</p>` : `<table><tr><th>Kategori</th><th>Nama Barang</th><th>Kekurangan</th></tr>` + listMinus.map(item => `<tr><td>${item.kategori}</td><td style="text-align:left">${item.nama}</td><td style="color:red; font-weight:700">${item.selisih}</td></tr>`).join('') + `</table>`;
  document.getElementById('rekapMinusContainer').innerHTML = `<div class="rekap-container">${rekapHtml}</div>`;
  document.getElementById('totalStok').innerHTML = `🏪 ${kodeToko} | 📦 ${shiftAktif} - PIC: ${namaPIC || '-'} | Status: ${isSelesai? 'SELESAI' : 'PROSES'} | Total Item: ${dataBarang.length} | Total OH: ${totalOH} | Total Fisik: ${totalFisik}`;
  simpanData();
}

function updateOH(i, val){ dataBarang[i].oh = val; tampilkan(); }
function updateFisik(i, val){ dataBarang[i].fisik = val; tampilkan(); }

function simpanData(){
  let key = `dataBarang_${tanggalAktif}_${shiftAktif}`;
  let dataSimpan = {barang: dataBarang, pic: namaPIC, selesai: isSelesai, toko: kodeToko};
  sessionStorage.setItem(key, JSON.stringify(dataSimpan));
}

function loadData(){
  let key = `dataBarang_${tanggalAktif}_${shiftAktif}`;
  let data = JSON.parse(sessionStorage.getItem(key));
  if(data){
    dataBarang = data.barang || []; namaPIC = data.pic || ""; isSelesai = data.selesai || false; kodeToko = data.toko || "K792/KARBELA2";
    document.getElementById('namaPIC').value = namaPIC;
    document.getElementById('kodeToko').value = kodeToko;
    document.getElementById('subTitleToko').innerText = kodeToko;
    document.getElementById('statusSelesai').innerHTML = isSelesai? `<span class="selesai-badge">✅ SELESAI</span>` : ``;
  } else {
    dataBarang = []; namaPIC = ""; isSelesai = false; kodeToko = "K792/KARBELA2";
    document.getElementById('namaPIC').value = ""; document.getElementById('kodeToko').value = kodeToko;
  }
}

function simpanOpname(){
  let tgl = document.getElementById('tanggalOpname').value;
  let shift = document.getElementById('pilihShift').value;
  namaPIC = document.getElementById('namaPIC').value.trim();
  kodeToko = document.getElementById('kodeToko').value.trim();
  if(!tgl){ alert('Pilih tanggal!'); return; }
  if(!namaPIC){ alert('Isi Nama PIC dulu!'); return; }
  if(!kodeToko){ alert('Isi Kode Toko dulu!'); return; }

  tanggalAktif = tgl; shiftAktif = shift;

  let key = `riwayat_${tgl}_${shift}_${kodeToko}`;
  let dataSimpan = {barang: dataBarang, pic: namaPIC, waktu: new Date().toLocaleTimeString(), toko: kodeToko};
  sessionStorage.setItem(key, JSON.stringify(dataSimpan));
  tampilkanDaftarRiwayat();
  alert(`Data opname ${kodeToko} - ${tgl} - ${shift} - PIC: ${namaPIC} sudah disimpan!`);
}

function tampilkanDaftarRiwayat(){
  let keys = Object.keys(sessionStorage).filter(k => k.startsWith('riwayat_')).sort().reverse();
  let html = '';
  if(keys.length === 0){ html = '<p>Belum ada riwayat</p>'; }
  else {
    keys.forEach(k => {
      let parts = k.replace('riwayat_','').split('_');
      let tgl = parts[0]; let shift = parts[1]; let toko = parts[2] || '';
      let data = JSON.parse(sessionStorage.getItem(k));
      let pic = data.pic || '-';
      html += `<button class="btn-riwayat" onclick="loadRiwayat('${tgl}','${shift}','${toko}')">📅 ${tgl} - ${shift} - ${toko} - PIC: ${pic}</button>`;
    });
  }
  document.getElementById('listRiwayat').innerHTML = html;
}

function loadRiwayat(tgl, shift, toko){
  tanggalAktif = tgl; shiftAktif = shift; kodeToko = toko;
  let key = `riwayat_${tgl}_${shift}_${toko}`;
  let data = JSON.parse(sessionStorage.getItem(key));
  if(data){
    dataBarang = data.barang; namaPIC = data.pic;
    document.getElementById('tanggalOpname').value = tgl;
    document.getElementById('pilihShift').value = shift;
    document.getElementById('namaPIC').value = namaPIC;
    document.getElementById('kodeToko').value = toko;
    document.getElementById('subTitleToko').innerText = toko;
    tampilkan();
  } else { alert('Data tidak ada'); }
}

function exportExcel(){
  let tgl = document.getElementById('tanggalOpname').value;
  let shift = document.getElementById('pilihShift').value;
  let csv = `Toko,${kodeToko}\nTanggal,${tgl}\nShift,${shift}\nPIC,${namaPIC}\n\nKategori,Kode,Nama Barang,OH,Fisik,Selisih\n`;
  dataBarang.forEach((item)=>{
    let selisih = (Number(item.fisik) || 0) - (Number(item.oh) || 0);
    csv += `${item.kategori},${item.kode},"${item.nama}",${item.oh},${item.fisik},${selisih}\n`;
  });
  let blob = new Blob([csv], {type: 'text/csv'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `SO-${kodeToko}-${shift}-${tgl}-${namaPIC}.csv`;
  a.click();
}
</script>
</body>
</html>
