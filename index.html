let userLogin = null;

function showMenu(menu) {
  document.querySelectorAll('.page').forEach(p => {p.classList.remove('active'); p.style.display = 'none';});
  let target = document.getElementById(menu === 'home'? 'home' : 'menu' + menu.charAt(0).toUpperCase() + menu.slice(1));
  target.style.display = 'block';
  setTimeout(()=> target.classList.add('active'), 10);
  if(menu === 'daftarRuang') tampilkanRuang();
  if(menu === 'laporan') tampilkanRekapSelisih();
  if(menu === 'dashboard') updateDashboard();
}

function showToast(pesan = "✅ Data Tersimpan"){
  const t = document.getElementById('toast');
  t.innerText = pesan;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2000);
}

window.onload = function(){
  document.getElementById('tanggalOpname').valueAsDate = new Date();
  cekLogin();
}

function cekLogin(){
  userLogin = JSON.parse(sessionStorage.getItem('userLogin'));
  if(userLogin){
    document.getElementById('loginPage').style.display='none';
    document.getElementById('mainApp').style.display='block';
    document.getElementById('namaUser').innerText = `${userLogin.nama}`;
    if(userLogin.role==='admin') document.getElementById('adminPanel').style.display='block';
    tampilkanListUser();
    showMenu('home');
  }
}

function login(){
  let nik = document.getElementById('inputNIK').value;
  let pin = document.getElementById('inputPIN').value;
  let user = users.find(u => u.nik===nik && u.pin===pin);
  if(user){
    userLogin = user;
    sessionStorage.setItem('userLogin', JSON.stringify(user));
    cekLogin();
  } else {
    document.getElementById('loginError').innerText = 'NIK/PIN Salah! Coba ADMIN 1234';
  }
}

function logout(){ sessionStorage.removeItem('userLogin'); location.reload(); }
function toggleDark(){ document.body.classList.toggle('dark'); }

function tambahUser(){
  if(userLogin.role!=='admin') return alert('Hanya Admin!');
  let newUser = {nik: document.getElementById('newNIK').value, pin: document.getElementById('newPIN').value, nama: document.getElementById('newNama').value, role: 'user'};
  if(users.find(u => u.nik === newUser.nik)) return alert('NIK sudah ada!');
  users.push(newUser);
  localStorage.setItem('users_so', JSON.stringify(users));
  alert('User berhasil ditambah');
  tampilkanListUser();
}

function tampilkanListUser(){
  let html = '<h4>Daftar User:</h4>';
  users.forEach(u => { html += `<div class="user-item"><span>${u.nik} - ${u.nama} ${u.role==='admin'?'(Admin)':''}</span></div>`; });
  document.getElementById('listUser').innerHTML = html;
}

function tambahRuang(){
  let nama = document.getElementById('namaRuangBaru').value;
  if(!nama) return alert('Isi nama ruang!');
  if(daftarRuang.find(r=>r.nama===nama)) return alert('Ruang sudah ada!');
  daftarRuang.push({id:Date.now(), nama:nama, data:[]});
  localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
  document.getElementById('namaRuangBaru').value='';
  tampilkanRuang();
}
function hapusRuang(id){
  if(confirm('Yakin hapus ruang ini?')){ daftarRuang = daftarRuang.filter(r=>r.id!==id); localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang)); tampilkanRuang(); }
}

  document.getElementById('kodeToko').value = ruangAktif.nama;
  showMenu('opname');
  document.getElementById('tanggalOpname').valueAsDate = new Date();
  loadData();
}
function tampilkanRuang(){
  let html='';
  daftarRuang.forEach(r=>{
    html+=`<div class="ruang-item"><div><b>${r.nama}</b><br><small>${r.data.length} Produk</small></div><div><button class="btn-aksi" onclick="bukaRuang(${r.id})">Buka</button><button class="btn-danger" onclick="hapusRuang(${r.id})">🗑️</button></div></div>`;
  });
  document.getElementById('listRuang').innerHTML = html || '<p>Belum ada ruang</p>';
}

function tambahProdukManual(){
  let kode = prompt("Kode Barang:"); if(!kode) return;
  if(ruangAktif.data.find(x=>x.kode===kode)) return alert('Kode sudah ada!');
  let nama = prompt("Nama Barang:"); if(!nama) return;
  let kategori = prompt("Kategori:"); if(!kategori) return;
  ruangAktif.data.push({kategori:kategori.toUpperCase(), kode:kode, nama:nama, oh:"0", fisik:"0", harga:"0"});
  tampilkan();
}
function hapusProduk(index){
  if(confirm(`Hapus ${ruangAktif.data[index].nama}?`)){ ruangAktif.data.splice(index,1); tampilkan(); }
}
function loadItems(){
  if(confirm('Reset data ruang ini ke 43 item template?')){ ruangAktif.data = JSON.parse(JSON.stringify(templateShift)); tampilkan(); }
}
function updateField(i, field, val){ ruangAktif.data[i][field]=val; tampilkan(); }

function tampilkan(){
  let container = document.getElementById('tabelContainer'); container.innerHTML = '';
  let kategoriList = [...new Set(ruangAktif.data.map(x => x.kategori))];
  let totalOH=0; let totalFisik=0;
  kategoriList.forEach(kat => {
    let html = `<h3>${kat}</h3><table id="tabel-${kat}"><tr><th>No</th><th>Kode</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Harga</th><th>Selisih</th><th>Selisih Rp</th><th>Aksi</th></tr>`;
    let no=1;
    ruangAktif.data.filter(x => x.kategori === kat).forEach((item) => {
      let index = ruangAktif.data.indexOf(item);
      totalOH += Number(item.oh) || 0; totalFisik += Number(item.fisik) || 0;
      let selisih = (Number(item.fisik) || 0) - (Number(item.oh) || 0);
      let selisihRp = selisih * (Number(item.harga) || 0);
      let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : '';
      html += `<tr id="row-${item.kode}"><td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td>
      <td><input type="number" value="${item.oh}" onchange="updateField(${index},'oh',this.value)" style="width:60px"></td>
      <td><input type="number" id="fisik-${item.kode}" value="${item.fisik}" onchange="updateField(${index},'fisik',this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.harga}" onchange="updateField(${index},'harga',this.value)" style="width:80px" placeholder="Harga"></td>
      <td class="${classSelisih}">${selisih}</td>
      <td class="${classSelisih}">Rp ${selisihRp.toLocaleString()}</td>
      <td><button class="btn-danger" onclick="hapusProduk(${index})">🗑️</button></td></tr>`;
    });
    html += `</table>`; container.innerHTML += html;
  });
  document.getElementById('totalStok').innerHTML = `Total Item: ${ruangAktif.data.length} | OH: ${totalOH} | Fisik: ${totalFisik}`;
  tampilkanRekapSelisih();
  updateDashboard();
}

function updateDashboard(){
  let dataUntukDashboard = ruangAktif? ruangAktif.data : [];
  let minus = dataUntukDashboard.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  let totalRugi = 0;
  minus.forEach(m => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); totalRugi += kurang * (Number(m.harga)||0); });
  document.getElementById('dashTotal2').innerText = dataUntukDashboard.length;
  document.getElementById('dashMinus2').innerText = minus.length;
  document.getElementById('dashRugi2').innerText = 'Rp ' + totalRugi.toLocaleString();
}

function tampilkanRekapSelisih(){
  let dataUntukLaporan = ruangAktif? ruangAktif.data : [];
  let keyword = document.getElementById('searchLaporan')?.value.toLowerCase() || '';
  let minus = dataUntukLaporan.filter(x => ((Number(x.fisik)||0) < (Number(x.oh)||0)) && x.nama.toLowerCase().includes(keyword));
  let plus = dataUntukLaporan.filter(x => ((Number(x.fisik)||0) > (Number(x.oh)||0)) && x.nama.toLowerCase().includes(keyword));
  let totalSelisihRp = 0;
  dataUntukLaporan.forEach(x => totalSelisihRp += ((Number(x.fisik)||0) - (Number(x.oh)||0)) * (Number(x.harga)||0) );
  let html = '';
  if(minus.length > 0){
    html += `<div class="rekap-box rekap-minus"><h3>❌ REKAP BARANG MINUS: ${minus.length} Item</h3>`;
    minus.forEach((m,i) => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); let rugi = kurang * (Number(m.harga)||0); html += `<p>${i+1}. ${m.nama} - Kurang <b>${kurang}</b> = <b>Rp ${rugi.toLocaleString()}</b></p>`; });
    html += `</div>`;
  }
  if(plus.length > 0){
    html += `<div class="rekap-box rekap-plus"><h3>✅ REKAP BARANG PLUS: ${plus.length} Item</h3>`;
    plus.forEach((p,i) => { let lebih = (Number(p.fisik)||0) - (Number(p.oh)||0); let untung = lebih * (Number(p.harga)||0); html += `<p>${i+1}. ${p.nama} - Lebih <b>${lebih}</b> = <b>Rp ${untung.toLocaleString()}</b></p>`; });
    html += `</div>`;
  }
  document.getElementById('rekapSelisih').innerHTML = html;
  document.getElementById('totalSelisihRp').innerHTML = `TOTAL SELISIH NILAI: Rp ${totalSelisihRp.toLocaleString()}`;
}

function handleScan(kode){
  let item = ruangAktif.data.find(x => x.kode === kode);
  if(item){ item.fisik = (Number(item.fisik)||0) + 1; tampilkan(); let row = document.getElementById(`row-${kode}`); if(row){ row.classList.add('highlight-row'); setTimeout(()=>row.classList.remove('highlight-row'), 1000); } showToast(`✅ ${item.nama} +1`); document.getElementById(`fisik-${kode}`).focus(); }
  else { showToast(`⚠️ Kode ${kode} tidak ditemukan`); }
}

function copyOHShiftSebelumnya(){
  let shift = document.getElementById('pilihShift').value;
  let tgl = document.getElementById('tanggalOpname').value;
  let shiftNum = parseInt(shift.replace('SHIFT ',''));
  if(shiftNum===1) return alert('Ini sudah SHIFT 1');
  let prevShift = `SHIFT ${shiftNum-1}`;
  let key = `so_${ruangAktif.id}_${tgl}_${prevShift}`;
  let dataPrev = JSON.parse(localStorage.getItem(key));
  if(!dataPrev) return alert(`Data ${prevShift} belum ada!`);
  ruangAktif.data.forEach((item,i) => { let itemPrev = dataPrev.barang.find(p => p.kode === item.kode); if(itemPrev) item.oh = itemPrev.fisik; });
  tampilkan(); alert(`OH berhasil diambil dari ${prevShift}`);
}

function lihatRiwayat(){
  let keys = Object.keys(localStorage).filter(k => k.startsWith(`so_${ruangAktif.id}_`));
  if(keys.length === 0) return alert('Belum ada riwayat SO');
  let html = '<h3>📜 RIWAYAT SO TERSIMPAN</h3><table><tr><th>Tanggal</th><th>Shift</th><th>PIC</th><th>Aksi</th></tr>';
  keys.forEach(key => {
    let data = JSON.parse(localStorage.getItem(key));
    let parts = key.split('_');
    let tgl = parts[2];
    let shift = parts[3];
    html += `<tr><td>${tgl}</td><td>${shift}</td><td>${data.pic || '-'}</td><td><button class="btn-aksi" onclick="bukaRiwayat('${key}')">Buka</button></td></tr>`;
  });
  html += '</table>';
  document.getElementById('tabelContainer').innerHTML = html;
}

function bukaRiwayat(key){
  let parts = key.split('_');
  let tgl = parts[2];
  let shift = parts[3];
  document.getElementById('tanggalOpname').value = tgl;
  document.getElementById('pilihShift').value = shift;
  loadData();
  showMenu('opname');
}

function kirimRekapWA(){
  let minus = ruangAktif.data.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  if(minus.length===0) return alert('Tidak ada barang minus!');
  let pesan = `*REKAP MINUS ${ruangAktif.nama}*\nTanggal: ${document.getElementById('tanggalOpname').value}\nShift: ${document.getElementById('pilihShift').value}\nPIC: ${document.getElementById('namaPIC').value}\n\n`;
  minus.forEach((m,i) => {
    let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0));
    let rugi = kurang * (Number(m.harga)||0);
    pesan += `${i+1}. ${m.nama} - Kurang ${kurang} = Rp ${rugi.toLocaleString()}\n`;
  });
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`);
}

function simpanOpname(){
  let key = `so_${ruangAktif.id}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  localStorage.setItem(key, JSON.stringify({barang:ruangAktif.data, pic:document.getElementById('namaPIC').value}));
  let index = daftarRuang.findIndex(r=>r.id===ruangAktif.id);
  daftarRuang[index].data = ruangAktif.data;
  localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
  showToast();
}

function loadData(){
  let key = `so_${ruangAktif.id}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  let data = JSON.parse(localStorage.getItem(key));
  if(data) { ruangAktif.data = data.barang || []; document.getElementById('namaPIC').value = data.pic || ''; }
  tampilkan();
}

function exportExcel(){
  let csv = 'KATEGORI,KODE,NAMA,OH,FISIK,HARGA,SELISIH,SELISIH_RP\n';
  ruangAktif.data.forEach(item => {
    let selisih = (Number(item.fisik)||0) - (Number(item.oh)||0);
    let selisihRp = selisih * (Number(item.harga)||0);
    csv += `${item.kategori},${item.kode},${item.nama},${item.oh},${item.fisik},${item.harga},${selisih},${selisihRp}\n`;
  });
  let blob = new Blob([csv], {type: 'text/csv'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${ruangAktif.nama}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}.csv`;
  a.click();
}

function exportCSV(){ exportExcel(); }

function exportPDF(){
  const doc = new jsPDF();
  let tgl = document.getElementById('tanggalOpname').value;
  let shift = document.getElementById('pilihShift').value;
  let pic = document.getElementById('namaPIC').value;
  doc.setFontSize(16); doc.text(`LAPORAN ${ruangAktif.nama}`, 105, 15, {align:"center"});
  doc.setFontSize(12); doc.text(`Tanggal: ${tgl}`, 14, 25); doc.text(`Shift: ${shift}`, 14, 32); doc.text(`PIC: ${pic}`, 14, 39);
  let y = 50;
  let minus = ruangAktif.data.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  let totalRugi = 0;
  doc.setFontSize(14); doc.text("REKAP BARANG MINUS", 14, y); y+=7;
  doc.setFontSize(10);
  minus.forEach((m,i) => {
    let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0));
    let rugi = kurang * (Number(m.harga)||0);
    totalRugi += rugi;
    doc.text(`${i+1}. ${m.nama} - Kurang ${kurang} = Rp ${rugi.toLocaleString()}`, 14, y);
    y+=6;
    if(y>270){ doc.addPage(); y=20; }
  });
  y+=5; doc.setFontSize(12); doc.text(`TOTAL RUGI: Rp ${totalRugi.toLocaleString()}`, 14, y);
  doc.save(`LAPORAN_${ruangAktif.nama}_${tgl}_${shift}.pdf`);
  showToast("✅ PDF Berhasil di Download");
}

function searchBarang(){
  let keyword = document.getElementById('searchBarang').value.toLowerCase();
}

function startScan(){
  const reader = document.getElementById('reader');
  const status = document.getElementById('readerStatus');
  reader.style.display = 'block';
  status.innerText = 'Arahkan kamera ke barcode...';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" }, { fps: 10, qrbox: {width: 250, height: 100} },
    qrCodeMessage => {
      handleScan(qrCodeMessage);
      html5QrCode.stop();
      reader.style.display = 'none';
      status.innerText = '';
    },
    errorMessage => {}
  ).catch(err => { status.innerText = "Gagal buka kamera. Izin ditolak?"; });
}
</script>
