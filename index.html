@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

function loadItems(){ dataBarang = templateShift.map(item => ({...item})); tampilkan(); showToast("📥 43 Item Dimuat"); }
function updateOH(i,val){dataBarang[i].oh=val; tampilkan();}
function updateFisik(i,val){dataBarang[i].fisik=val; tampilkan();}
function updateHarga(i,val){dataBarang[i].harga=val; tampilkan();}

function tampilkan(){ let container=document.getElementById('tabelContainer'); container.innerHTML=''; let kategoriList=[...new Set(dataBarang.map(x=>x.kategori))]; let totalOH=0; let totalFisik=0; kategoriList.forEach(kat=>{ let html=`<h3>${kat}</h3><table><tr><th>No</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Selisih</th></tr>`; let no=1; dataBarang.filter(x=>x.kategori===kat).forEach((item)=>{ let index=dataBarang.indexOf(item); totalOH+=Number(item.oh)||0; totalFisik+=Number(item.fisik)||0; let selisih=(Number(item.fisik)||0)-(Number(item.oh)||0); let classSelisih=selisih>0?'selisih-plus':selisih<0?'selisih-minus':''; html+=`<tr><td>${no++}</td><td style="text-align:left">${item.nama}</td><td><input type="number" value="${item.oh}" onchange="updateOH(${index},this.value)" style="width:60px"></td><td><input type="number" value="${item.fisik}" onchange="updateFisik(${index},this.value)" style="width:60px"></td><td class="${classSelisih}">${selisih}</td></tr>`; }); html+=`</table>`; container.innerHTML+=html; }); document.getElementById('totalStok').innerHTML=`Total: ${dataBarang.length} | OH: ${totalOH} | Fisik: ${totalFisik}`; tampilkanRekapSelisih(); }

function tampilkanRekapSelisih(){ let minus=dataBarang.filter(x=>(Number(x.fisik)||0)<(Number(x.oh)||0)); let html=''; if(minus.length>0){ html+=`<div style="background:#ffebee; padding:10px; border-radius:10px"><h3>❌ MINUS: ${minus.length} Item</h3>`; minus.forEach((m,i)=>{ let kurang=Math.abs((Number(m.fisik)||0)-(Number(m.oh)||0)); html+=`<p>${i+1}. ${m.nama} - Kurang <b>${kurang}</b></p>`; }); html+=`</div>`; } document.getElementById('rekapSelisih').innerHTML=html; }

function simpanOpname(){ let key=`so_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`; localStorage.setItem(key, JSON.stringify({barang:dataBarang, pic:document.getElementById('namaPIC').value})); showToast(); }

function kirimRekapWA(){ let minus=dataBarang.filter(x=>(Number(x.fisik)||0)<(Number(x.oh)||0)); let pesan=`*REKAP MINUS*\nTanggal: ${document.getElementById('tanggalOpname').value}\n\n`; minus.forEach((m,i)=>{ let kurang=Math.abs((Number(m.fisik)||0)-(Number(m.oh)||0)); pesan+=`${i+1}. ${m.nama} - Kurang ${kurang}\n`; }); window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`); }

function exportPDF(){ const doc=new jsPDF(); doc.text("LAPORAN SO K792",105,15,{align:"center"}); let y=30; dataBarang.forEach((m)=>{ let selisih=(Number(m.fisik)||0)-(Number(m.oh)||0); if(selisih!==0){ doc.text(`${m.nama} Selisih: ${selisih}`,14,y); y+=7; } }); doc.save(`SO_${document.getElementById('tanggalOpname').value}.pdf`); showToast("✅ PDF Download"); }
