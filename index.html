<script>
const { jsPDF } = window.jspdf;
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=11') }

let html5QrCode;
let dataBarang = [];
let ruangAktif = null;
let daftarRuang = JSON.parse(localStorage.getItem('daftar_ruang_so')) || [];
let users = JSON.parse(localStorage.getItem('users_so')) || [{nik:"ADMIN", pin:"1234", nama:"ADMIN", role:"admin"}];
let userLogin = null;

// TEMPLATE 43 KAMU TETAP
const templateShift = [...ISI 43 DATA KAMU DISINI... ];

function showMenu(menu) {
  document.querySelectorAll('.page').forEach(p => {p.classList.remove('active'); p.style.display = 'none';});
  let target = document.getElementById(menu === 'home'? 'home' : 'menu' + menu.charAt(0).toUpperCase() + menu.slice(1));
  target.style.display = 'block';
  setTimeout(()=> target.classList.add('active'), 10);
  if(menu === 'daftarRuang') tampilkanRuang();
  if(menu === 'laporan') tampilkanRekapSelisih();
  if(menu === 'dashboard') updateDashboard();
}

//... SEMUA FUNGSI LOGIN, DASHBOARD, LAPORAN KAMU TETAP...

/* ===== FUNGSI BARU MULTI RUANG ===== */
function tambahRuang(){
  let nama = document.getElementById('namaRuangBaru').value;
  if(!nama) return alert('Isi nama ruang!');
  daftarRuang.push({id:Date.now(), nama:nama, data:[]});
  localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
  document.getElementById('namaRuangBaru').value='';
  tampilkanRuang();
}

function hapusRuang(id){
  if(confirm('Hapus ruang ini?')){ daftarRuang = daftarRuang.filter(r=>r.id!==id); localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang)); tampilkanRuang(); }
}

function bukaRuang(id){
  ruangAktif = daftarRuang.find(r=>r.id===id);
  document.getElementById('judulRuang').innerText = `📝 Input Opname: ${ruangAktif.nama}`;
  document.getElementById('kodeToko').value = ruangAktif.nama;
  showMenu('opname');
  document.getElementById('tanggalOpname').valueAsDate = new Date();
  loadData();
}

function tampilkanRuang(){
  let html='';
  daftarRuang.forEach(r=>{
    html+=`<div class="ruang-item"><div><b>${r.nama}</b><br><small>${r.data.length} Produk</small></div>
    <div><button class="btn-aksi" onclick="bukaRuang(${r.id})">Buka</button>
    <button class="btn-danger" onclick="hapusRuang(${r.id})">🗑️</button></div></div>`;
  });
  document.getElementById('listRuang').innerHTML = html || '<p>Belum ada ruang</p>';
}

/* ===== FUNGSI BARU TAMBAH/HAPUS PRODUK ===== */
function tambahProdukManual(){
  let kode = prompt("Kode:"); if(!kode) return;
  if(ruangAktif.data.find(x=>x.kode===kode)) return alert('Kode ada!');
  let nama = prompt("Nama:"); if(!nama) return;
  let kategori = prompt("Kategori:"); if(!kategori) return;
  ruangAktif.data.push({kategori:kategori.toUpperCase(), kode:kode, nama:nama, oh:"0", fisik:"0", harga:"0"});
  tampilkan();
}

function hapusProduk(index){
  if(confirm(`Hapus ${ruangAktif.data[index].nama}?`)){ ruangAktif.data.splice(index,1); tampilkan(); }
}

function loadItems(){
  if(confirm('Reset ke 43 item template?')){ ruangAktif.data = JSON.parse(JSON.stringify(templateShift)); tampilkan(); }
}

/* ===== FUNGSI TAMPILAN EDIT ===== */
function tampilkan(){
  let container = document.getElementById('tabelContainer'); container.innerHTML = '';
  let kategoriList = [...new Set(ruangAktif.data.map(x => x.kategori))];
  let totalOH=0; let totalFisik=0;
  kategoriList.forEach(kat => {
    let html = `<h3>${kat}</h3><table><tr><th>No</th><th>Kode</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Harga</th><th>Selisih</th><th>Selisih Rp</th><th>Aksi</th></tr>`; // TAMBAH AKSI
    let no=1;
    ruangAktif.data.filter(x => x.kategori === kat).forEach((item) => {
      let index = ruangAktif.data.indexOf(item);
      totalOH += Number(item.oh) || 0; totalFisik += Number(item.fisik) || 0;
      let selisih = (Number(item.fisik) || 0) - (Number(item.oh) || 0);
      let selisihRp = selisih * (Number(item.harga) || 0);
      let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : '';
      html += `<tr id="row-${item.kode}"><td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td>
      <td><input type="number" value="${item.oh}" onchange="updateField(${index},'oh',this.value)" style="width:60px"></td>
      <td><input type="number" id="fisik-${item.kode}" value="${item.fisik}" onchange="updateField(${index},'fisik',this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.harga}" onchange="updateField(${index},'harga',this.value)" style="width:80px"></td>
      <td class="${classSelisih}">${selisih}</td>
      <td class="${classSelisih}">Rp ${selisihRp.toLocaleString()}</td>
      <td><button class="btn-danger" onclick="hapusProduk(${index})">🗑️</button></td></tr>`; // TOMBOL HAPUS
    });
    html += `</table>`; container.innerHTML += html;
  });
  document.getElementById('totalStok').innerHTML = `Total Item: ${ruangAktif.data.length} | OH: ${totalOH} | Fisik: ${totalFisik}`;
}

function updateField(i, field, val){ ruangAktif.data[i][field]=val; tampilkan(); }

/* ===== SIMPAN & LOAD EDIT KE PER RUANG ===== */
function simpanOpname(){
  let key = `so_${ruangAktif.id}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  localStorage.setItem(key, JSON.stringify({barang:ruangAktif.data, pic:document.getElementById('namaPIC').value}));
  let index = daftarRuang.findIndex(r=>r.id===ruangAktif.id);
  daftarRuang[index].data = ruangAktif.data;
  localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
  showToast();
}

function loadData(){
  let key = `so_${ruangAktif.id}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  let data = JSON.parse(localStorage.getItem(key));
  if(data) { ruangAktif.data = data.barang || []; document.getElementById('namaPIC').value = data.pic || ''; }
  tampilkan();
}

function startScan(){ /* KODE KAMU TETAP */ }
function exportPDF(){ /* KODE KAMU TETAP */ }
function exportExcel(){ /* KODE KAMU TETAP */ }

function cekLogin(){ /* KODE KAMU TETAP */ }
function login(){ /* KODE KAMU TETAP */ }
function logout(){ /* KODE KAMU TETAP */ }
</script>
