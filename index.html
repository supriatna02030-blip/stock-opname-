<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO MULTI RUANG K792</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{font-family:'Poppins', sans-serif}
  body{background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px; transition:0.3s}
  body.dark{background:#1a1a2e}
.container{background:white; padding:25px; border-radius:20px; width:100%; max-width:1200px; box-shadow: 0 10px 30px rgba(0,0,0,0.2)}
  body.dark.container{background:#16213e; color:white}
  #toast{ position:fixed; top:-60px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:12px 25px; border-radius:20px; transition: top 0.4s; z-index:999; font-weight:600; }
  #toast.show{ top:20px; }
.ruang-card{background:#f1f8ff; border:2px solid #4facfe; padding:15px; border-radius:15px; margin:10px 0; display:flex; justify-content:space-between; align-items:center}
  body.dark.ruang-card{background:#0f3460; border-color:#00f2fe}
.btn-ruang{background:#8e44ad; color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight:600; width:auto}
.btn-danger{background:#e74c3c; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; width:auto}
.btn-aksi{background:#27ae60; color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight:600; width:auto}
.btn-pdf{background:#e67e22; color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight:600; width:auto}
.btn-back{background:#7f8c8d; color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; width:auto; margin-bottom:10px}
.btn-dark{position:fixed; top:20px; right:20px; width:50px; height:50px; border-radius:50%; font-size:20px; z-index:999; padding:0}
  input,button,select{width:100%; padding:12px; margin:6px 0; border:2px solid #eee; border-radius:10px; box-sizing:border-box; font-size:14px}
  body.dark input,body.dark select{background:#0f3460; color:white; border-color:#333}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px}
  th{background:#2980b9; color:white; padding:8px; position:sticky; top:0}
  td{padding:8px; border-bottom:1px solid #ddd; text-align:center}
  body.dark td{border-color:#333}
.selisih-minus{color:red; font-weight:700}
.selisih-plus{color:green; font-weight:700}
.page{display:none}
.page.active{display:block; animation: slideUp 0.3s ease-out;}
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.header{display:flex; justify-content:space-between; align-items:center}
 #reader{width:100%; border-radius:10px; overflow:hidden; display:none; margin:10px 0; border:2px solid #4facfe}
</style>
</head>
<body>
<button class="btn-dark" onclick="toggleDark()">🌙</button>
<div id="toast">✅ Data Tersimpan</div>

<div class="container">
  <!-- LOGIN -->
  <div id="loginPage">
    <h2 style="text-align:center">🔐 LOGIN SO MULTI</h2>
    <input type="text" id="inputNIK" placeholder="NIK: ADMIN">
    <input type="password" id="inputPIN" placeholder="PIN: 1234">
    <button onclick="login()">Login</button>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none">
    <!-- HAL 1: DAFTAR RUANG -->
    <div id="home" class="page active">
      <div class="header"><h2>🏠 Daftar Ruang SO</h2><button class="btn-danger" onclick="logout()">🚪 Logout</button></div>
      <div style="display:flex; gap:10px">
        <input type="text" id="namaRuangBaru" placeholder="Contoh: SO RAHIL A">
        <button class="btn-ruang" onclick="tambahRuang()">➕ Tambah Ruang</button>
      </div>
      <div id="listRuang"></div>
    </div>

    <!-- HAL 2: INPUT OPNAME -->
    <div id="menuOpname" class="page">
      <button class="btn-back" onclick="kembaliHome()">⬅️ Kembali ke Daftar Ruang</button>
      <h2 id="judulRuang"></h2>
      <input type="date" id="tanggalOpname">
      <select id="pilihShift" onchange="loadData()">
        <option>SHIFT 1</option><option>SHIFT 2</option><option>SHIFT 3</option>
      </select>
      <input type="text" id="namaPIC" placeholder="👤 Nama PIC">

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin:10px 0">
        <button class="btn-aksi" onclick="loadTemplateRuang()">📥 Load 43 Item</button>
        <button class="btn-ruang" onclick="tambahProdukManual()">➕ Tambah Produk</button>
        <button class="btn-aksi" onclick="startScan()">📷 Scan</button>
        <button class="btn-aksi" onclick="simpanOpname()">💾 Simpan</button>
        <button class="btn-aksi" onclick="exportExcel()">📤 Excel</button>
        <button class="btn-pdf" onclick="exportPDF()">📑 PDF</button>
      </div>
      <div id="reader"></div>
      <div id="tabelContainer"></div>
    </div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
let ruangAktif = null;
let daftarRuang = JSON.parse(localStorage.getItem('daftar_ruang_so')) || [];
let html5QrCode;

// ISI 43 DATA KAMU DISINI. KALAU MAU KOSONGIN AJA DULU JUGA BOLEH
const template43 = [
{kategori:"KANZLER SINGLE", kode:"417806", nama:"kanzler sgl mini 65g", oh:"0", fisik:"0", harga:"0"},

{kategori:"FRESHMILK", kode:"FM1", nama:"Diamond", oh:"0", fisik:"0", harga:"0"},

{kategori:"MINYAK", kode:"433436", nama:"Camar myk grg pch 2L", oh:"0", fisik:"0", harga:"0"},
{kategori:"MINYAK", kode:"123332", nama:"Alfamart myk grg pch 2L", oh:"0", fisik:"0", harga:"0"},
{kategori:"MINYAK", kode:"453308", nama:"Vipco myk 2L", oh:"0", fisik:"0", harga:"0"},
{kategori:"MINYAK", kode:"45258", nama:"Merah pth myk 2L", oh:"0", fisik:"0", harga:"0"},
{kategori:"MINYAK", kode:"436397", nama:"ikan dorang myk grng kelapa", oh:"0", fisik:"0", harga:"0"}
];

function showToast(pesan){ const t=document.getElementById('toast'); t.innerText=pesan; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function login(){ if(document.getElementById('inputNIK').value==="ADMIN" && document.getElementById('inputPIN').value==="1234"){ sessionStorage.setItem('login','ok'); document.getElementById('loginPage').style.display='none'; document.getElementById('mainApp').style.display='block'; tampilkanRuang(); } else alert('NIK/PIN Salah. Coba ADMIN / 1234') }
function logout(){ sessionStorage.clear(); location.reload(); }
function kembaliHome(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById('home').classList.add('active'); tampilkanRuang(); }
function toggleDark(){ document.body.classList.toggle('dark'); }

// MANAJEMEN RUANG
function tambahRuang(){
  let nama = document.getElementById('namaRuangBaru').value.trim();
  if(!nama) return alert('Isi nama ruang!');
  if(daftarRuang.find(r=>r.nama.toLowerCase()===nama.toLowerCase())) return alert('Ruang sudah ada!');
  daftarRuang.push({id:Date.now(), nama:nama, data:[]});
  localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
  document.getElementById('namaRuangBaru').value='';
  tampilkanRuang();
  showToast('✅ Ruang Ditambahkan');
}

function hapusRuang(id){
  if(confirm('Yakin hapus ruang ini? Semua data SO nya ikut hilang!')){
    daftarRuang = daftarRuang.filter(r=>r.id!==id);
    localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
    tampilkanRuang();
  }
}

function bukaRuang(id){
  ruangAktif = daftarRuang.find(r=>r.id===id);
  document.getElementById('judulRuang').innerText = `📝 ${ruangAktif.nama}`;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('menuOpname').classList.add('active');
  document.getElementById('tanggalOpname').valueAsDate = new Date();
  loadData();
}

function tampilkanRuang(){
  let html='';
  if(daftarRuang.length===0) html='<p>Belum ada ruang. Tambah dulu contoh: SO RAHIL A</p>';
  daftarRuang.forEach(r=>{
    html+=`<div class="ruang-card"><div><b>${r.nama}</b><br><small>${r.data.length} Produk</small></div><div>
      <button class="btn-aksi" onclick="bukaRuang(${r.id})">Buka</button>
      <button class="btn-danger" onclick="hapusRuang(${r.id})">🗑️</button>
      </div></div>`;
  });
  document.getElementById('listRuang').innerHTML = html;
}

// MANAJEMEN DATA
function loadTemplateRuang(){
  if(confirm('Reset data ruang ini ke template 43 item?')){
    ruangAktif.data = JSON.parse(JSON.stringify(template43));
    tampilkan();
  }
}

function tambahProdukManual(){
  let kode = prompt("Kode Barang:"); if(!kode) return;
  if(ruangAktif.data.find(x=>x.kode===kode)) return alert('Kode sudah ada!');
  let nama = prompt("Nama Barang:"); if(!nama) return;
  let kategori = prompt("Kategori:"); if(!kategori) return;
  ruangAktif.data.push({kategori:kategori.toUpperCase(), kode:kode, nama:nama, oh:"0", fisik:"0", harga:"0"});
  tampilkan();
}

function hapusProduk(index){
  if(confirm(`Hapus ${ruangAktif.data[index].nama}?`)){
    ruangAktif.data.splice(index,1);
    tampilkan();
  }
}

function updateField(i, field, val){ ruangAktif.data[i][field]=val; tampilkan(); }

function tampilkan(){
  let container=document.getElementById('tabelContainer'); container.innerHTML='';
  let kategoriList = [...new Set(ruangAktif.data.map(x => x.kategori))];
  kategoriList.forEach(kat=>{
    let html=`<h3>${kat}</h3><table><tr><th>No</th><th>Kode</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Harga</th><th>Selisih</th><th>Aksi</th></tr>`;
    let no=1;
    ruangAktif.data.filter(x=>x.kategori===kat).forEach((item)=>{
      let i = ruangAktif.data.indexOf(item);
      let selisih = (Number(item.fisik)||0) - (Number(item.oh)||0);
      let cls = selisih<0?'selisih-minus':selisih>0?'selisih-plus':'';
      html+=`<tr>
      <td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td>
      <td><input type="number" value="${item.oh}" onchange="updateField(${i},'oh',this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.fisik}" onchange="updateField(${i},'fisik',this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.harga}" onchange="updateField(${i},'harga',this.value)" style="width:80px"></td>
      <td class="${cls}">${selisih}</td>
      <td><button class="btn-danger" onclick="hapusProduk(${i})">🗑️</button></td>
      </tr>`;
    });
    html+='</table>'; container.innerHTML+=html;
  });
}

function simpanOpname(){
  let key = `so_${ruangAktif.id}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  localStorage.setItem(key, JSON.stringify({barang:ruangAktif.data, pic:document.getElementById('namaPIC').value}));
  let index = daftarRuang.findIndex(r=>r.id===ruangAktif.id);
  daftarRuang[index].data = ruangAktif.data;
  localStorage.setItem('daftar_ruang_so', JSON.stringify(daftarRuang));
  showToast('✅ Data Disimpan');
}

function loadData(){
  let key = `so_${ruangAktif.id}_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  let data = JSON.parse(localStorage.getItem(key));
  if(data){ ruangAktif.data = data.barang || []; document.getElementById('namaPIC').value = data.pic || ''; }
  tampilkan();
}

function startScan(){
  document.getElementById('reader').style.display='block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
  qrCodeMessage => {
    let item = ruangAktif.data.find(x=>x.kode===qrCodeMessage);
    if(item){ item.fisik = (Number(item.fisik)||0)+1; tampilkan(); showToast(`✅ ${item.nama} +1`); }
    else showToast(`⚠️ Kode ${qrCodeMessage} tidak ada`);
    html5QrCode.stop(); document.getElementById('reader').style.display='none';
  }, err=>{});
}

function exportExcel(){
  let csv = 'KATEGORI,KODE,NAMA,OH,FISIK,HARGA,SELISIH\n';
  ruangAktif.data.forEach(item => { let selisih = (Number(item.fisik)||0) - (Number(item.oh)||0); csv += `${item.kategori},${item.kode},${item.nama},${item.oh},${item.fisik},${item.harga},${selisih}\n`; });
  let blob = new Blob([csv], {type: 'text/csv'});
  let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${ruangAktif.nama}_${document.getElementById('tanggalOpname').value}.csv`; a.click();
}

function exportPDF(){
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text(`LAPORAN ${ruangAktif.nama}`, 105, 15, {align:"center"});
  doc.setFontSize(10);
  let y=30;
  ruangAktif.data.forEach((m,i) => { let selisih = (Number(m.fisik)||0) - (Number(m.oh)||0); doc.text(`${i+1}. ${m.nama} - OH:${m.oh} Fisik:${m.fisik} Selisih:${selisih}`, 14, y); y+=7; if(y>270){doc.addPage(); y=20;} });
  doc.save(`${ruangAktif.nama}.pdf`);
  showToast('✅ PDF Terdownload');
}
</script>
</body>
</html>
