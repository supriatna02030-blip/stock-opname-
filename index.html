<style>*{font-family:'Poppins', sans-serif; box-sizing:border-box} body{background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px; transition:0.3s} body.dark{background:#1a1a2e}.container{background:white; padding:25px; border-radius:20px; width:100%; max-width:1200px; box-shadow: 0 10px 30px rgba(0,0,0,0.2)} body.dark.container{background:#16213e; color:white} @keyframes blink { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.4; transform:scale(1.05)} } @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }.page.active { animation: slideUp 0.3s ease-out; } button:active { transform: scale(0.95); transition: 0.1s; } #toast{ position:fixed; top:-60px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:12px 25px; border-radius:20px; transition: top 0.4s cubic-bezier(.68,-0.55,.27,1.55); z-index:999; font-weight:600; box-shadow:0 4px 15px rgba(0,0,0,0.2) } #toast.show{ top:20px; }.dashboard{display:flex; gap:10px; margin:20px 0; flex-wrap:wrap}.dash-card{flex:1; min-width:110px; padding:15px; border-radius:15px; text-align:center; color:white; box-shadow:0 4px 10px rgba(0,0,0,0.1)}.dash-card h4{margin:0; font-size:12px; opacity:0.9; font-weight:400}.dash-card h2{margin:5px 0 0; font-size:24px; font-weight:700}.card-item{background:linear-gradient(135deg,#4facfe,#00f2fe)}.card-minus{background:linear-gradient(135deg,#e74c3c,#c0392b)}.card-rugi{background:linear-gradient(135deg,#f39c12,#e67e22)}.header-toko{text-align:center; padding:10px 0 15px; margin-bottom:15px; border-bottom:2px solid #eee}.logo-gradient{ width:75px;height:75px;margin:0 auto 12px; background:linear-gradient(135deg,#007CF0,#00DFD8); color:white;font-size:26px;font-weight:800; display:flex;align-items:center;justify-content:center; border-radius:22px;box-shadow:0 6px 18px rgba(0,124,240,0.35) }.header-toko h1{margin:5px 0; font-size:22px; color:#007CF0} body.dark.header-toko h1{color:#00f2fe}.header-toko p{margin:0; font-size:13px; opacity:0.8}.progress-bar{display:flex;align-items:center;gap:8px;font-size:12px; margin-top:10px}.progress-bar.bar{flex:1;height:8px;background:#E0F2FF;border-radius:10px;overflow:hidden}.progress-bar.fill{height:100%;background:linear-gradient(90deg,#007CF0,#00DFD8);transition:width.5s}.greeting{margin:15px 0 20px; text-align:center}.greeting h2{margin:0;font-size:20px;color:#007CF0} body.dark.greeting h2{color:#00f2fe}.greeting p{margin:4px 0 0;font-size:13px;color:#666}.stats{display:flex;gap:10px;margin:18px 0}.stat-box{flex:1;background:#F0F9FF;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,124,240,0.1)} body.dark.stat-box{background:#0f3460}.stat-box b{display:block;font-size:20px;color:#007CF0} body.dark.stat-box b{color:#00f2fe}.stat-box span{font-size:12px;color:#666}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu-btn{ background:linear-gradient(135deg,#007CF0,#00DFD8); color:white;border:none;padding:18px;border-radius:16px; box-shadow:0 4px 12px rgba(0,124,240,0.25);text-align:left;cursor:pointer; transition:transform.1s; width:100%; margin:0; font-size:15px }.menu-btn:active{transform:scale(0.97)}.menu-btn.full{grid-column:1/3}.menu-btn.icon{font-size:24px;display:block;margin-bottom:6px}.menu-btn b{display:block;font-size:15px; font-weight:600}.menu-btn small{font-size:11px;opacity:0.9; font-weight:400} footer{text-align:center;font-size:12px;color:#999;margin-top:25px} h2{text-align:center; color:#2980b9; font-weight:700} body.dark h2{color:#00f2fe} input,button,select{width:100%; padding:12px; margin:6px 0; border:2px solid #eee; border-radius:10px; box-sizing:border-box; font-size:14px} body.dark input,body.dark select{background:#0f3460; color:white; border-color:#333} button:hover{opacity:0.9; transform:translateY(-1px)} button:disabled{opacity:0.6; cursor:not-allowed}.btn-aksi{background:#27ae60; width:auto; padding:10px 15px; margin:5px}.btn-admin{background:#8e44ad; width:auto; padding:10px 15px; margin:5px; color:white}.btn-wa{background:#25D366; width:auto; padding:10px 15px; margin:5px; color:white}.btn-danger{background:#e74c3c; width:auto; padding:8px 12px; margin:3px; color:white; font-size:12px}.btn-pdf{background:#e67e22; width:auto; padding:10px 15px; margin:5px; color:white}.btn-back{background:#7f8c8d; width:auto; padding:10px 15px; margin:10px 0}.btn-dark{position:fixed; top:20px; right:20px; width:50px; height:50px; border-radius:50%; font-size:20px; z-index:999; padding:0}.login-box{max-width:400px; margin:auto}.admin-panel{border:2px dashed #8e44ad; padding:15px; border-radius:10px; margin:15px 0; background:#f4ecf7} body.dark.admin-panel{background:#2c003e} table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px} th{background:#2980b9; color:white; padding:8px; position:sticky; top:0} td{padding:8px; border-bottom:1px solid #ddd; text-align:center} body.dark td{border-color:#333}.selisih-minus{color:red; font-weight:700; animation: blink 0.8s infinite;}.selisih-plus{color:green; font-weight:700; animation: blink 0.8s infinite;}.user-item{display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #ddd}.rekap-box{margin-top:20px; padding:15px; border-radius:10px}.rekap-minus{background:#ffebee; border-left:5px solid #e74c3c}.rekap-plus{background:#e8f5e9; border-left:5px solid #27ae60} body.dark.rekap-minus{background:#3e1f1f} body.dark.rekap-plus{background:#1f3e2a}.page{display:none}.search-box{display:flex; gap:10px}.search-box input{flex:1}.search-box button{width:55px; padding:12px}.total-rp-box{background:#ffc107; color:#000; padding:15px; border-radius:10px; margin-top:15px; font-weight:700; text-align:center; font-size:16px} #reader{width:100%; border-radius:10px; overflow:hidden; display:none; margin-top:10px; border:2px solid #4facfe} #readerStatus{text-align:center; font-size:12px; color:#2980b9; margin-top:5px}.highlight-row{background: #fff3cd!important; transition: 0.5s;}</style>

<body>
<button class="btn-dark" onclick="toggleDark()">🌙</button>
<div id="toast">✅ Data Tersimpan</div>
<div class="container">
  <div id="loginPage" class="login-box"><h2>🔐 LOGIN SO K792</h2><input type="text" id="inputNIK" placeholder="NIK Karyawan"><input type="password" id="inputPIN" placeholder="PIN"><button onclick="login()">Login</button><p id="loginError" style="color:red; text-align:center"></p></div>
  <div id="mainApp" style="display:none">
    <div id="home" class="page active"><div class="header-toko"><div class="logo-gradient">K792</div><h1>SO RAHIL K792</h1><p>Alfamart Karbela 2</p><div class="progress-bar"><span id="progressText">Progres SO: 0%</span><div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div></div></div><div class="greeting"><h2 id="sapa">Selamat Datang 👋</h2><p id="tanggalHariIni"></p></div><div class="stats"><div class="stat-box"><b id="totalItem">0</b><span>Total</span></div><div class="stat-box"><b id="sudahItem">0</b><span>Sudah</span></div><div class="stat-box"><b id="sisaItem">0</b><span>Sisa</span></div></div><div class="menu-grid"><button class="menu-btn" onclick="showMenu('opname')"><span class="icon">📝</span><b>Input Opname</b><small id="inputInfo">Mulai input barang</small></button><button class="menu-btn" onclick="showMenu('dashboard')"><span class="icon">📊</span><b>Dashboard</b><small>Lihat grafik</small></button><button class="menu-btn" onclick="showMenu('laporan')"><span class="icon">📋</span><b>Laporan & Rekap</b><small>Export Excel/PDF</small></button><button class="menu-btn" onclick="showMenu('backup')"><span class="icon">📤</span><b>Backup & Data</b><small>Aman offline</small></button></div><button class="menu-btn full" style="margin-top:12px" onclick="showMenu('setting')"><span class="icon">⚙️</span><b>Pengaturan</b></button><button class="menu-btn full btn-danger" style="margin-top:12px" onclick="logout()"><span class="icon">🚪</span><b>Logout</b></button><footer>v1.2.0 | SO RAHIL K792</footer></div>
    <div id="menuDashboard" class="page"><button class="btn-back" onclick="showMenu('home')">⬅️ Kembali ke Home</button><h2>📊 Dashboard Ringkasan</h2><div class="dashboard"><div class="dash-card card-item"><h4>Total Item</h4><h2 id="dashTotal2">0</h2></div><div class="dash-card card-minus"><h4>Minus</h4><h2 id="dashMinus2">0</h2></div><div class="dash-card card-rugi"><h4>Rugi</h4><h2 id="dashRugi2">Rp 0</h2></div></div></div>
    <div id="menuOpname" class="page"><button class="btn-back" onclick="showMenu('home')">⬅️ Kembali ke Home</button><h2>📝 Input Opname</h2><input type="text" id="kodeToko" value="K792/KARBELA2"><div style="display:flex; gap:10px"><input type="date" id="tanggalOpname"><select id="pilihShift" onchange="loadData()"><option>SHIFT 1</option><option>SHIFT 2</option><option>SHIFT 3</option></select></div><input type="text" id="namaPIC" placeholder="👤 Nama PIC"><div class="search-box"><input type="text" id="searchBarang" placeholder="🔍 Cari Barang / Scan Barcode..." onkeyup="searchBarang()"><button onclick="startScan()">📷</button></div><div id="reader"></div><p id="readerStatus"></p><div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center"><button class="btn-aksi" onclick="loadItems()">📥 Load 43 Item</button><button class="btn-aksi" onclick="copyOHShiftSebelumnya()">📋 Ambil OH Shift Sebelumnya</button><button class="btn-aksi" onclick="simpanOpname()">💾 Simpan Opname</button></div><div id="tabelContainer"></div><div id="totalStok" style="margin-top:15px; font-weight:700; background:#2980b9; color:white; padding:15px; border-radius:15px; text-align:center"></div></div>
    <div id="menuLaporan" class="page"><button class="btn-back" onclick="showMenu('home')">⬅️ Kembali ke Home</button><h2>📊 Laporan & Rekap</h2><input type="text" id="searchLaporan" class="search-box" placeholder="🔍 Cari di Laporan..." onkeyup="tampilkanRekapSelisih()"><button class="btn-aksi" onclick="lihatRiwayat()">📜 Lihat Riwayat</button><button class="btn-wa" onclick="kirimRekapWA()">📲 Kirim Rekap Minus WA</button><button class="btn-aksi" onclick="exportExcel()">📤 Export Excel</button><button class="btn-pdf" onclick="exportPDF()">📑 Export PDF</button><div id="rekapSelisih"></div><div id="totalSelisihRp" class="total-rp-box"></div></div>
    <div id="menuBackup" class="page"><button class="btn-back" onclick="showMenu('home')">⬅️ Kembali ke Home</button><h2>📤 Backup & Data</h2><button class="btn-aksi" onclick="exportCSV()">📤 Backup Manual.CSV</button></div>
    <div id="menuSetting" class="page"><button class="btn-back" onclick="showMenu('home')">⬅️ Kembali ke Home</button><h2>⚙️ Pengaturan</h2><div id="adminPanel" class="admin-panel" style="display:none"><h3>Panel Admin</h3><input type="text" id="newNIK" placeholder="NIK Baru"><input type="text" id="newPIN" placeholder="PIN Baru"><input type="text" id="newNama" placeholder="Nama Karyawan"><button class="btn-admin" onclick="tambahUser()">+ Tambah User</button><div id="listUser"></div></div><button class="btn-aksi" onclick="toggleDark()">🌙 Ganti Tema</button></div>
  </div>

<script>
const { jsPDF } = window.jspdf;
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=15').then(reg => console.log('SW Registered', reg)).catch(err => console.log('SW Error', err)); }
let html5QrCode; let dataBarang = []; let users = JSON.parse(localStorage.getItem('users_so')) || [{nik:"ADMIN", pin:"1234", nama:"ADMIN", role:"admin"}]; let userLogin = null;
function showMenu(menu) { document.querySelectorAll('.page').forEach(p => {p.classList.remove('active'); p.style.display = 'none';}); let target = document.getElementById(menu === 'home'? 'home' : 'menu' + menu.charAt(0).toUpperCase() + menu.slice(1)); target.style.display = 'block'; setTimeout(()=> target.classList.add('active'), 10); if(menu === 'laporan') tampilkanRekapSelisih(); if(menu === 'dashboard') updateDashboard(); if(menu === 'home') updateHomeStats(); }
function showToast(pesan = "✅ Data Tersimpan"){ const t = document.getElementById('toast'); t.innerText = pesan; t.classList.add('show'); setTimeout(()=> t.classList.remove('show'), 2000); }
window.onload = function(){ document.getElementById('tanggalOpname').valueAsDate = new Date(); setTanggalSapa(); cekLogin(); }
function setTanggalSapa(){ const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"]; const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"]; const d = new Date(); const jam = d.getHours(); let sapa = "Selamat Malam"; if(jam < 11) sapa = "Selamat Pagi"; else if(jam < 15) sapa = "Selamat Siang"; else if(jam < 18) sapa = "Selamat Sore"; document.getElementById('sapa').innerText = `${sapa}, ${userLogin? userLogin.nama : 'Rahil'} 👋`; document.getElementById('tanggalHariIni').innerText = `${hari[d.getDay()]}, ${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`; }
function updateHomeStats(){ let keys = Object.keys(localStorage).filter(k => k.startsWith('so_')); let dataTerakhir = []; if(keys.length > 0){ let keyTerakhir = keys.sort().reverse()[0]; dataTerakhir = JSON.parse(localStorage.getItem(keyTerakhir))?.barang || []; } let total = dataTerakhir.length; let sudah = dataTerakhir.filter(x => x.fisik!== "" && x.fisik!== null && x.fisik!= 0).length; let sisa = total - sudah; let progress = total > 0? Math.round((sudah/total)*100) : 0; document.getElementById('totalItem').innerText = total; document.getElementById('sudahItem').innerText = sudah; document.getElementById('sisaItem').innerText = sisa; document.getElementById('progressFill').style.width = progress + "%"; document.getElementById('progressText').innerText = `Progres SO: ${progress}%`; document.getElementById('inputInfo').innerText = `${sudah} item sudah diinput`; }
function cekLogin(){ userLogin = JSON.parse(sessionStorage.getItem('userLogin')); if(userLogin){ document.getElementById('loginPage').style.display='none'; document.getElementById('mainApp').style.display='block'; if(userLogin.role==='admin') document.getElementById('adminPanel').style.display='block'; tampilkanListUser(); setTanggalSapa(); updateHomeStats(); showMenu('home'); } }
function login(){ let nik = document.getElementById('inputNIK').value; let pin = document.getElementById('inputPIN').value; let user = users.find(u => u.nik===nik && u.pin===pin); if(user){ userLogin = user; sessionStorage.setItem('userLogin', JSON.stringify(user)); cekLogin(); } else { document.getElementById('loginError').innerText = 'NIK/PIN Salah!'; } }
function logout(){ sessionStorage.removeItem('userLogin'); location.reload(); }
function tambahUser(){ if(userLogin.role!=='admin') return alert('Hanya Admin!'); let newUser = {nik: document.getElementById('newNIK').value, pin: document.getElementById('newPIN').value, nama: document.getElementById('newNama').value, role: 'user'}; if(users.find(u => u.nik === newUser.nik)) return alert('NIK sudah ada!'); users.push(newUser); localStorage.setItem('users_so', JSON.stringify(users)); alert('User berhasil ditambah'); tampilkanListUser(); }
function tampilkanListUser(){ let html = '<h4>Daftar User:</h4>'; users.forEach(u => { html += `<div class="user-item"><span>${u.nik} - ${u.nama} ${u.role==='admin'?'(Admin)':''}</span></div>`; }); document.getElementById('listUser').innerHTML = html; }
const templateShift = [{kategori:"KANZLER SINGLE", kode:"417806", nama:"kanzler sgl mini 65g", oh:"", fisik:"", harga:"0"},{kategori:"KANZLER SINGLE", kode:"417804", nama:"kanzler sgl ori 65g", oh:"", fisik:"", harga:"0"},{kategori:"MINYAK", kode:"436397", nama:"ikan dorang myk grng kelapa", oh:"", fisik:"", harga:"0"}];
function loadItems(){ const btn = event.target; const textAwal = btn.innerHTML; btn.innerHTML = "⏳ Loading..."; btn.disabled = true; setTimeout(()=>{ dataBarang = templateShift.map(item => ({...item})); tampilkan(); btn.innerHTML = textAwal; btn.disabled = false; }, 500); }
function updateOH(i, val){ dataBarang[i].oh = val; tampilkan(); }
function updateFisik(i, val){ dataBarang[i].fisik = val; tampilkan(); }
function updateHarga(i, val){ dataBarang[i].harga = val; tampilkan(); }
function tampilkan(){ let container = document.getElementById('tabelContainer'); container.innerHTML = ''; let kategoriList = [...new Set(dataBarang.map(x => x.kategori))]; let totalOH=0; let totalFisik=0; kategoriList.forEach(kat => { let html = `<h3>${kat}</h3><table id="tabel-${kat}"><tr><th>No</th><th>Kode</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Harga</th><th>Selisih</th><th>Selisih Rp</th></tr>`; let no=1; dataBarang.filter(x => x.kategori === kat).forEach((item) => { let index = dataBarang.indexOf(item); totalOH += Number(item.oh) || 0; totalFisik += Number(item.fisik) || 0; let selisih = (Number(item.fisik) || 0) - (Number(item.oh) || 0); let selisihRp = selisih * (Number(item.harga) || 0); let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : ''; html += `<tr id="row-${item.kode}"><td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td><td><input type="number" value="${item.oh}" onchange="updateOH(${index}, this.value)" style="width:60px"></td><td><input type="number" id="fisik-${item.kode}" value="${item.fisik}" onchange="updateFisik(${index}, this.value)" style="width:60px"></td><td><input type="number" value="${item.harga}" onchange="updateHarga(${index}, this.value)" style="width:80px" placeholder="Harga"></td><td class="${classSelisih}">${selisih}</td><td class="${classSelisih}">Rp ${selisihRp.toLocaleString()}</td></tr>`; }); html += `</table>`; container.innerHTML += html; }); document.getElementById('totalStok').innerHTML = `Total Item: ${dataBarang.length} | OH: ${totalOH} | Fisik: ${totalFisik}`; tampilkanRekapSelisih(); updateDashboard(); updateHomeStats(); }
function updateDashboard(){ let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0)); let totalRugi = 0; minus.forEach(m => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); totalRugi += kurang * (Number(m.harga)||0); }); document.getElementById('dashTotal2').innerText = dataBarang.length; document.getElementById('dashMinus2').innerText = minus.length; document.getElementById('dashRugi2').innerText = 'Rp ' + totalRugi.toLocaleString(); }
function tampilkanRekapSelisih(){ let keyword = document.getElementById('searchLaporan')?.value.toLowerCase() || ''; let minus = dataBarang.filter(x => ((Number(x.fisik)||0) < (Number(x.oh)||0)) && x.nama.toLowerCase().includes(keyword)); let plus = dataBarang.filter(x => ((Number(x.fisik)||0) > (Number(x.oh)||0)) && x.nama.toLowerCase().includes(keyword)); let totalSelisihRp = 0; dataBarang.forEach(x => totalSelisihRp += ((Number(x.fisik)||0) - (Number(x.oh)||0)) * (Number(x.harga)||0) ); let html = ''; if(minus.length > 0){ html += `<div class="rekap-box rekap-minus"><h3>❌ REKAP BARANG MINUS: ${minus.length} Item</h3>`; minus.forEach((m,i) => { let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0)); let rugi = kurang * (Number(m.harga)||0); html += `<p>${i+1}. ${m.nama} - Kurang <b>${kurang}</b> = <b>Rp ${rugi.toLocaleString()}</b></p>`; }); html += `</div>`; } if(plus.length > 0){ html += `<div class="rekap-box rekap-plus"><h3>✅ REKAP BARANG PLUS: ${plus.length} Item</h3>`; plus.forEach((p,i) => { let lebih = (Number(p.fisik)||0) - (Number(p.oh)||0); let untung = lebih * (Number(p.harga)||0); html += `<p>${i+1}. ${p.nama} - Lebih <b>${lebih}</b> = <b>Rp ${untung.toLocaleString()}</b></p>`; }); html += `</div>`; } document.getElementById('rekapSelisih').innerHTML = html; document.getElementById('totalSelisihRp').innerHTML = `TOTAL SELISIH NILAI: Rp ${totalSelisihRp.toLocaleString()}`; }
function handleScan(kode){ let item = dataBarang.find(x => x.kode === kode); if(item){ item.fisik = (Number(item.fisik)||0) + 1; tampilkan(); let row = document.getElementById(`row-${kode}`); if(row){ row.classList.add('highlight-row'); setTimeout(()=>row.classList.remove('highlight-row'), 1000); } showToast(`✅ ${item.nama} +1`); document.getElementById(`fisik-${kode}`).focus(); } else { showToast(`⚠️ Kode ${kode} tidak ditemukan`); } }
function copyOHShiftSebelumnya(){ let shift = document.getElementById('pilihShift').value; let tgl = document.getElementById('tanggalOpname').value; let shiftNum = parseInt(shift.replace('SHIFT ','')); if(shiftNum===1) return alert('Ini sudah SHIFT 1'); let prevShift = `SHIFT ${shiftNum-1}`; let key = `so_${tgl}_${prevShift}`; let dataPrev = JSON.parse(localStorage.getItem(key)); if(!dataPrev) return alert(`Data ${prevShift} belum ada!`); dataBarang.forEach((item,i) => { let
