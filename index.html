<body>

    <button onclick="login()">Login</button>

<script>
let dataBarang = [];
let users = JSON.parse(localStorage.getItem('users_so')) || [{nik:"ADMIN", pin:"1234", nama:"ADMIN", role:"admin"}];
let logLogin = JSON.parse(localStorage.getItem('logLogin_so')) || [];
let userLogin = null;

window.onload = function(){
  document.getElementById('tanggalOpname').valueAsDate = new Date();
  cekLogin();
}

function cekLogin(){
  userLogin = JSON.parse(sessionStorage.getItem('userLogin'));
  if(userLogin){
    document.getElementById('loginPage').style.display='none';
    document.getElementById('mainApp').style.display='block';
    document.getElementById('namaUser').innerText = `| ${userLogin.nama}`;
    if(userLogin.role==='admin') document.getElementById('adminPanel').style.display='block';
    tampilkanListUser();
    loadData();
  }
}

function login(){
  let nik = document.getElementById('inputNIK').value;
  let pin = document.getElementById('inputPIN').value;
  let user = users.find(u => u.nik===nik && u.pin===pin);
  if(user){
    userLogin = user;
    sessionStorage.setItem('userLogin', JSON.stringify(user));
    logLogin.push({nik: user.nik, nama: user.nama, waktu: new Date().toLocaleString('id-ID')});
    localStorage.setItem('logLogin_so', JSON.stringify(logLogin));
    cekLogin();
  } else {
    document.getElementById('loginError').innerText = 'NIK/PIN Salah!';
  }
}

function logout(){ sessionStorage.removeItem('userLogin'); location.reload(); }

function tambahUser(){
  if(userLogin.role!=='admin') return alert('Hanya Admin!');
  let newUser = {nik: document.getElementById('newNIK').value, pin: document.getElementById('newPIN').value, nama: document.getElementById('newNama').value, role: 'user'};
  if(users.find(u => u.nik === newUser.nik)) return alert('NIK sudah ada!');
  users.push(newUser);
  localStorage.setItem('users_so', JSON.stringify(users));
  alert('User berhasil ditambah');
  tampilkanListUser();
}

function hapusUser(nik){
  if(!confirm(`Hapus user ${nik}?`)) return;
  users = users.filter(u => u.nik!== nik);
  localStorage.setItem('users_so', JSON.stringify(users));
  tampilkanListUser();
}

function resetPIN(nik){
  let pinBaru = prompt(`Masukkan PIN baru untuk ${nik}:`);
  if(!pinBaru) return;
  let user = users.find(u => u.nik === nik);
  if(user){ user.pin = pinBaru; localStorage.setItem('users_so', JSON.stringify(users)); alert(`PIN ${nik} berhasil direset`); }
}

function tampilkanListUser(){
  let html = '<h4>Daftar User:</h4>';
  users.forEach(u => {
    html += `<div class="user-item"><span>${u.nik} - ${u.nama} ${u.role==='admin'?'(Admin)':''}</span>
    <div>${u.nik!=='ADMIN'?`<button class="btn-danger" onclick="resetPIN('${u.nik}')">Reset PIN</button><button class="btn-danger" onclick="hapusUser('${u.nik}')">Hapus</button>`:''}</div></div>`;
  });
  document.getElementById('listUser').innerHTML = html;
}

function lihatLogLogin(){
  if(logLogin.length === 0) return document.getElementById('logLoginAdmin').innerHTML = '<p>Belum ada log login</p>';
  let html = '<h4>📋 Log Login Karyawan:</h4><table><tr><th>Waktu</th><th>NIK</th><th>Nama</th></tr>';
  logLogin.reverse().forEach(log => {
    html += `<tr><td>${log.waktu}</td><td>${log.nik}</td><td>${log.nama}</td></tr>`;
  });
  html += '</table><button class="btn-danger" onclick="hapusLog()">Hapus Semua Log</button>';
  document.getElementById('logLoginAdmin').innerHTML = html;
}

function hapusLog(){
  if(confirm('Hapus semua log login?')){
    logLogin = [];
    localStorage.setItem('logLogin_so', JSON.stringify(logLogin));
    lihatLogLogin();
  }
}

function loadTemplate(){ if(confirm('Load 43 item?')){ dataBarang = templateShift.map(item => ({...item})); tampilkan(); alert('Template berhasil dimuat!'); }}
function updateOH(i, val){ dataBarang[i].oh = val; tampilkan(); }
function updateFisik(i, val){ dataBarang[i].fisik = val; tampilkan(); }

function tampilkan(){
  let container = document.getElementById('tabelContainer'); container.innerHTML = '';
  let kategoriList = [...new Set(dataBarang.map(x => x.kategori))];
  let totalOH=0; let totalFisik=0;
  kategoriList.forEach(kat => {
    let html = `<h3>${kat}</h3><table><tr><th>No</th><th>Kode</th><th>Nama</th><th>OH</th><th>Fisik</th><th>Selisih</th></tr>`;
    let no=1;
    dataBarang.filter(x => x.kategori === kat).forEach((item) => {
      let index = dataBarang.indexOf(item);
      totalOH += Number(item.oh) || 0; totalFisik += Number(item.fisik) || 0;
      let selisih = (Number(item.fisik) || 0) - (Number(item.oh) || 0);
      let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : '';
      html += `<tr><td>${no++}</td><td>${item.kode}</td><td style="text-align:left">${item.nama}</td>
      <td><input type="number" value="${item.oh}" onchange="updateOH(${index}, this.value)" style="width:60px"></td>
      <td><input type="number" value="${item.fisik}" onchange="updateFisik(${index}, this.value)" style="width:60px"></td>
      <td class="${classSelisih}">${selisih}</td></tr>`;
    });
    html += `</table>`; container.innerHTML += html;
  });
  document.getElementById('totalStok').innerHTML = `Total Item: ${dataBarang.length} | OH: ${totalOH} | Fisik: ${totalFisik}`;
  tampilkanRekapSelisih(); // PANGGIL REKAP OTOMATIS
}

function tampilkanRekapSelisih(){
  let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  let plus = dataBarang.filter(x => (Number(x.fisik)||0) > (Number(x.oh)||0));
  
  let html = '';
  
  if(minus.length > 0){
    html += `<div class="rekap-box rekap-minus"><h3>❌ REKAP BARANG MINUS: ${minus.length} Item</h3>`;
    minus.forEach((m,i) => {
      let kurang = Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0));
      html += `<p>${i+1}. ${m.nama} - Kurang <b>${kurang}</b> | OH:${m.oh} Fisik:${m.fisik}</p>`;
    });
    html += `</div>`;
  }
  
  if(plus.length > 0){
    html += `<div class="rekap-box rekap-plus"><h3>✅ REKAP BARANG PLUS: ${plus.length} Item</h3>`;
    plus.forEach((p,i) => {
      let lebih = (Number(p.fisik)||0) - (Number(p.oh)||0);
      html += `<p>${i+1}. ${p.nama} - Lebih <b>${lebih}</b> | OH:${p.oh} Fisik:${p.fisik}</p>`;
    });
    html += `</div>`;
  }
  
  document.getElementById('rekapSelisih').innerHTML = html;
}

function copyOHShiftSebelumnya(){
  let shift = document.getElementById('pilihShift').value;
  let tgl = document.getElementById('tanggalOpname').value;
  let shiftNum = parseInt(shift.replace('SHIFT ',''));
  if(shiftNum===1) return alert('Ini sudah SHIFT 1');
  let prevShift = `SHIFT ${shiftNum-1}`;
  let key = `so_${tgl}_${prevShift}`;
  let dataPrev = JSON.parse(localStorage.getItem(key));
  if(!dataPrev) return alert(`Data ${prevShift} belum ada!`);
  dataBarang.forEach((item,i) => {
    let itemPrev = dataPrev.barang.find(p => p.kode === item.kode);
    if(itemPrev) item.oh = itemPrev.fisik;
  });
  tampilkan(); alert(`OH berhasil diambil dari ${prevShift}`);
}

function lihatRiwayat(){
  let keys = Object.keys(localStorage).filter(k => k.startsWith('so_'));
  if(keys.length === 0) return alert('Belum ada riwayat SO yg tersimpan di HP ini');
  let html = '<h3>📜 RIWAYAT SO TERSIMPAN</h3>';
  html += '<table><tr><th>Tanggal</th><th>Shift</th><th>PIC</th><th>Aksi</th></tr>';
  keys.forEach(key => {
    let data = JSON.parse(localStorage.getItem(key));
    let [_, tgl, shift] = key.split('_');
    html += `<tr><td>${tgl}</td><td>${shift}</td><td>${data.pic || '-'}</td><td><button onclick="bukaRiwayat('${key}')">Buka</button></td></tr>`;
  });
  html += '</table>';
  document.getElementById('tabelContainer').innerHTML = html;
  document.getElementById('rekapSelisih').innerHTML = ''; // kosongin rekap pas liat riwayat
}

function bukaRiwayat(key){
  let [_, tgl, shift] = key.split('_');
  document.getElementById('tanggalOpname').value = tgl;
  document.getElementById('pilihShift').value = shift;
  loadData();
  alert(`Membuka data ${tgl} - ${shift}`);
}

function kirimRekapWA(){
  let minus = dataBarang.filter(x => (Number(x.fisik)||0) < (Number(x.oh)||0));
  if(minus.length===0) return alert('Tidak ada barang minus!');
  let pesan = `*REKAP MINUS SO ${document.getElementById('kodeToko').value}*\nTanggal: ${document.getElementById('tanggalOpname').value}\nShift: ${document.getElementById('pilihShift').value}\nPIC: ${document.getElementById('namaPIC').value}\n\n`;
  minus.forEach((m,i) => pesan += `${i+1}. ${m.nama} - Kurang ${Math.abs((Number(m.fisik)||0) - (Number(m.oh)||0))}\n`);
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`);
}

function simpanOpname(){
  let key = `so_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  localStorage.setItem(key, JSON.stringify({barang:dataBarang, pic:document.getElementById('namaPIC').value}));
  alert('Data tersimpan di HP ini!');
}

function loadData(){
  let key = `so_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}`;
  let data = JSON.parse(localStorage.getItem(key));
  if(data) { dataBarang = data.barang || []; document.getElementById('namaPIC').value = data.pic || ''; }
  else dataBarang = [];
  tampilkan();
}

function exportExcel(){
  let csv = 'KATEGORI,KODE,NAMA,OH,FISIK,SELISIH\n';
  dataBarang.forEach(item => {
    let selisih = (Number(item.fisik)||0) - (Number(item.oh)||0);
    csv += `${item.kategori},${item.kode},${item.nama},${item.oh},${item.fisik},${selisih}\n`;
  });
  let blob = new Blob([csv], {type: 'text/csv'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a'); a.href = url; a.download = `SO_${document.getElementById('tanggalOpname').value}_${document.getElementById('pilihShift').value}.csv`; a.click();
}

function searchBarang(){
  let keyword = document.getElementById('searchBarang').value.toLowerCase();
}

function toggleDark(){ document.body.classList.toggle('dark'); }
